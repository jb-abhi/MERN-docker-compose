services:
  backend:
    build: ./mern/backend
    ports:
      - "5050:5050"
    networks:
      - private
    environment:
      MONGO_URI: mongodb://mongo:27017/mydatabase
    depends_on:
      - mongodb
  frontend:
    build: ./mern/frontend
    ports:
      - "5173:5173"
    environment:
      REACT_APP_API_URL: http://backend:5050
    networks:
      - private
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - private
    volumes:
      - mongo-data:/data/db

networks:
  private:
    driver: bridge

volumes:
  mongo-data:
    driver: local
