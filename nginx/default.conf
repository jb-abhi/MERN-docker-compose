upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:5050;
}

server {
    listen 80;

    location / {
        proxy_pass http://frontend;
    }
		
		location /api/ {
				proxy_pass http://backend/;
				proxy_http_version 1.1;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
		}
}